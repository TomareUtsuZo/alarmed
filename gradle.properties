# Gradle properties for the Alarmed project

# Enable AndroidX (required for all modern Android libraries)
android.useAndroidX=true

# Jetifier helps with legacy dependencies (can be removed later)
android.enableJetifier=true

# Gradle daemon settings for better performance
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin settings
kotlin.code.style=official

# Disable configuration cache to avoid serialization issues
org.gradle.configuration-cache=false
